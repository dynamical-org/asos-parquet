[project]
name = "asos-parquet"
version = "0.1.0"
description = "Full-history ASOS geoparquet dataset from Iowa Mesonet"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "shapely>=2.0.0",
    "boto3>=1.43.68",
    "python-dotenv>=1.2.2",
    "duckdb>=1.5.5",
    "rich>=15.0.0",
    "sentry-sdk>=2.67.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "modal>=1.5.3",
]
examples = [
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asos_parquet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
files = ["src/asos_parquet/canonical.py", "src/asos_parquet/contracts.py", "tests/test_canonical.py", "src/asos_parquet/capabilities.py", "tests/test_capabilities.py", "src/asos_parquet/composers.py", "tests/test_composers.py", "src/asos_parquet/adapters/iem.py", "tests/test_iem.py", "src/asos_parquet/adapters/iem_precip.py", "tests/test_iem_precip.py", "tests/test_iem_precip_review.py", "src/asos_parquet/iem_rebuild.py", "tests/test_iem_rebuild.py", "scripts/rebuild_iem_2026.py", "src/asos_parquet/adapters/eccc_climate.py", "src/asos_parquet/eccc_rebuild.py", "src/asos_parquet/eccc_reconciliation.py", "tests/test_eccc_climate.py", "tests/test_eccc_rebuild.py", "tests/test_eccc_reconciliation.py", "scripts/rebuild_eccc_2026.py", "src/asos_parquet/eccc_capture.py", "tests/test_eccc_capture.py", "scripts/capture_eccc_2026.py", "src/asos_parquet/adapters/swob.py", "src/asos_parquet/swob_rebuild.py", "tests/test_swob.py", "tests/test_swob_rebuild.py", "scripts/rebuild_swob_2026.py", "tests/test_swob_review.py", "src/asos_parquet/swob_capture.py", "tests/test_swob_capture.py", "scripts/capture_swob_realtime.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "modal>=1.5.3",
    "mypy>=2.3.0,<3",
    "pandas-stubs>=3.0.5.260730,<4",
    "pyarrow-stubs>=20.0.0.20260625",
    "types-geopandas>=1.1.4.20260807",
]
