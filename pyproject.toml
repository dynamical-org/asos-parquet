[project]
name = "asos-parquet"
version = "0.1.0"
description = "Full-history ASOS geoparquet dataset from Iowa Mesonet"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "tqdm>=4.69.0",
    "shapely>=2.0.0",
    "boto3>=1.43.51",
    "python-dotenv>=1.2.2",
    "duckdb>=1.5.4",
    "rich>=15.0.0",
    "logtail-python>=0.4.0",
    "sentry-sdk>=2.66.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.22",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "modal>=1.5.2",
]
examples = [
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asos_parquet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "modal>=1.5.2",
]
