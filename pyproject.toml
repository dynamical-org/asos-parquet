[project]
name = "asos-parquet"
version = "0.1.0"
description = "Full-history ASOS geoparquet dataset from Iowa Mesonet"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "shapely>=2.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "duckdb>=1.4.3",
    "rich>=13.0.0",
    "sentry-sdk>=2.63.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "modal>=0.64.0",
]
examples = [
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asos_parquet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
files = ["src/asos_parquet/canonical.py", "src/asos_parquet/contracts.py", "tests/test_canonical.py", "src/asos_parquet/capabilities.py", "tests/test_capabilities.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "modal>=1.3.0.post1",
    "mypy>=1.18,<2",
    "pandas-stubs>=2.2,<3",
    "pyarrow-stubs>=20.0.0.20260625",
]
