name: Deploy to Modal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  # Keyed by ref so a PR run cannot cancel an in-flight deploy of main and
  # leave production running code older than main. Successive pushes to main
  # still supersede each other, which is what we want: latest wins.
  group: deploy-modal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src/asos_parquet/canonical.py src/asos_parquet/contracts.py tests/test_canonical.py
      - run: uv run mypy
      - run: uv run pytest

  deploy:
    # workflow_dispatch can target any branch; never expose prod Modal
    # credentials to a deploy from anything but main.
    if: github.ref == 'refs/heads/main'
    # Without this, a red main still ships to Modal: on 2026-08-13 a mypy
    # failure merged and deployed anyway. The deployed app runs the hourly
    # ASOS publisher, so a broken deploy is a data outage, not just a red X.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run modal deploy modal_app.py
