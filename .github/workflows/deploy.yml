name: Deploy to Modal

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Keyed by ref so a PR run cannot cancel an in-flight deploy of main and
  # leave production running code older than main. Successive pushes to main
  # still supersede each other, which is what we want: latest wins.
  group: deploy-modal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pull requests run checks.yml directly.
    uses: ./.github/workflows/checks.yml

  deploy:
    # workflow_dispatch can target any branch; never expose prod Modal
    # credentials to a deploy from anything but main.
    if: github.ref == 'refs/heads/main'
    # Without this, a red main still ships to Modal: on 2026-08-13 a mypy
    # failure merged and deployed anyway. The deployed app runs the hourly
    # ASOS publisher, so a broken deploy is a data outage, not just a red X.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The app lives in the `critical` Modal environment. Deploys stay held
      # (and fail loudly, not skip) until the one-time cutover is done; see
      # deploy/README.md "Modal environment".
      - name: Require critical deploys to be enabled
        if: vars.MODAL_CRITICAL_DEPLOY_ENABLED != 'true'
        run: |
          echo '::error::Critical deployment is held; complete the operator cutover before enabling.'
          exit 1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run modal deploy --env critical modal_app.py
