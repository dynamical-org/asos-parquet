name: Checks

on:
  pull_request:
  workflow_call:

concurrency:
  # PR runs supersede each other per ref. When called from deploy.yml,
  # github.workflow is the caller's name, so this group never collides with a
  # PR run; the caller's own concurrency already supersedes pushes to main.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src/asos_parquet/canonical.py src/asos_parquet/contracts.py tests/test_canonical.py
      - run: uv run mypy
      - run: uv run pytest
